name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ZapretGUI
    steps:
      # ZapretGUI references ZDefree.Core via ProjectReference at
      # ../../../ZDefree-tools/src/ZDefree.Core/ZDefree.Core.csproj — both repos
      # must be checked out side-by-side under the workspace.
      - name: Checkout ZapretGUI
        uses: actions/checkout@v4
        with:
          path: ZapretGUI

      - name: Checkout ZDefree-tools (sibling)
        uses: actions/checkout@v4
        with:
          repository: SEMI-FAZIO/ZDefree-tools
          ref: main
          path: ZDefree-tools

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore ZapretGUI.sln

      - name: Build
        run: dotnet build ZapretGUI.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/ZapretGUI.Tests/ZapretGUI.Tests.csproj -c Release --no-build --verbosity normal

      - name: Publish (framework-dependent single file)
        run: |
          dotnet publish src/ZapretGUI/ZapretGUI.csproj `
            -c Release -r win-x64 `
            --self-contained false `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=embedded `
            -o publish-fdd

      - name: Publish (self-contained single file)
        run: |
          dotnet publish src/ZapretGUI/ZapretGUI.csproj `
            -c Release -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=embedded `
            -o publish-sc

      - name: Upload framework-dependent artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZapretGUI-net8
          path: ZapretGUI/publish-fdd/ZapretGUI.exe

      - name: Upload self-contained artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZapretGUI-portable
          path: ZapretGUI/publish-sc/ZapretGUI.exe
